<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock C · Space-time</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f0d0a;
        --amber: #f2a33a;
        --mid: rgba(242, 163, 58, 0.62);
        --dim: rgba(242, 163, 58, 0.28);
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--amber); }
      body { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 14px; }
      canvas { position: fixed; inset: 0; }
      .panel {
        position: fixed;
        left: 6vw;
        top: 50%;
        transform: translateY(-50%);
        width: min(500px, calc(100vw - 48px));
        background: var(--bg);
        border: 1px solid var(--dim);
        padding: 28px 30px 26px;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        color: var(--dim);
        font-size: 12px;
        margin: -28px -30px 22px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--dim);
      }
      h1 { font-size: 20px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
      dl { margin-top: 18px; display: grid; grid-template-columns: 9ch 1fr; row-gap: 6px; line-height: 1.55; }
      dt { color: var(--dim); }
      dd { color: var(--mid); }
      nav { margin-top: 22px; display: flex; gap: 14px; flex-wrap: wrap; }
      a { color: var(--amber); text-decoration: none; }
      a::before { content: "["; color: var(--dim); }
      a::after { content: "]"; color: var(--dim); }
      a:hover { background: var(--amber); color: var(--bg); }
      @media (max-width: 760px) {
        .panel { left: 24px; top: 8vh; transform: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <main class="panel" id="panel">
      <div class="bar"><span>~/diogo</span><span id="clock">t=0</span></div>
      <h1>Diogo Santos</h1>
      <dl>
        <dt>now</dt><dd>software engineer @ cloudflare</dd>
        <dt>before</dt><dd>distributed validators @ obol / dv labs</dd>
        <dt>thesis</dt><dd>asynchronous byzantine consensus</dd>
      </dl>
      <nav>
        <a href="https://github.com/DiogoSantoss">github</a>
        <a href="https://www.linkedin.com/in/diogo-silva-santos/">linkedin</a>
        <a href="https://x.com/l_Didas_l">x</a>
        <a href="../cv-diogo-santos.pdf">cv</a>
        <a href="../blog.html">blog</a>
      </nav>
    </main>

    <script type="module">
      import { startAscii } from "./grid.js";

      const SITES = ["lis", "ams", "fra", "iad", "sjc", "sin", "gru"];
      const A = (a) => `rgba(242,163,58,${a})`;
      const RIGHT = 9;
      const clockEl = document.getElementById("clock");

      let P, laneY, lam, events, msgs, buf, col;

      function setCell(g, x, y, c, k) {
        x = Math.round(x); y = Math.round(y);
        if (x < 0 || y < 0 || x >= g.cols || y >= g.rows) return;
        buf[y * g.cols + x] = c;
        col[y * g.cols + x] = k;
      }

      startAscii(document.getElementById("bg"), {
        fontFamily: '"IBM Plex Mono", monospace',
        fontSize: 13,
        lineHeight: 1.3,
        fps: 10,
        bg: "#0f0d0a",
        masks: [document.getElementById("panel")],
        maskPad: [1, 0],
        init(g) {
          P = Math.max(3, Math.min(SITES.length, Math.floor((g.rows - 4) / 4)));
          laneY = Array.from({ length: P }, (_, k) => Math.round(2 + ((k + 0.5) * (g.rows - 4)) / P));
          lam = new Array(P).fill(0);
          events = []; msgs = [];
          buf = new Array(g.cols * g.rows);
          col = new Uint8Array(g.cols * g.rows);
          for (let i = 0; i < 400; i++) tick(g); // pre-fill history
        },
        tick,
        draw,
      });

      function tick(g) {
          g.t++;
          for (let p = 0; p < P; p++) {
            const r = Math.random();
            if (r < 0.024) {
              let to = Math.floor(Math.random() * (P - 1));
              if (to >= p) to++;
              lam[p]++;
              msgs.push({ from: p, to, ts: g.t, tr: g.t + 8 + Math.floor(Math.random() * 46), clk: lam[p], done: false });
              events.push({ p, t: g.t, kind: "s" });
            } else if (r < 0.03) {
              lam[p]++;
              events.push({ p, t: g.t, kind: "l" });
            }
          }
          for (const m of msgs) {
            if (!m.done && g.t >= m.tr) {
              m.done = true;
              lam[m.to] = Math.max(lam[m.to], m.clk) + 1;
              events.push({ p: m.to, t: g.t, kind: "r", clk: lam[m.to], label: Math.random() < 0.4 });
            }
          }
          const horizon = g.t - g.cols - 10;
          events = events.filter((e) => e.t > horizon);
          msgs = msgs.filter((m) => !m.done || m.tr > horizon);
          clockEl.textContent = `lamport max=${Math.max(...lam)}`;
      }

      function draw(g) {
          buf.fill(undefined);
          const xNow = g.cols - RIGHT;
          const xOf = (t) => xNow - (g.t - t);

          laneY.forEach((y) => {
            for (let x = 0; x < xNow; x++) setCell(g, x, y, "─", 1);
          });

          for (const m of msgs) {
            const y0 = laneY[m.from], y1 = laneY[m.to];
            const tEnd = Math.min(g.t, m.tr);
            const frac = (tEnd - m.ts) / (m.tr - m.ts);
            const x0 = xOf(m.ts), x1 = xOf(tEnd);
            const yEnd = y0 + (y1 - y0) * frac;
            const dx = x1 - x0, dy = yEnd - y0;
            const slope = Math.abs((y1 - y0) * 2.1 / (m.tr - m.ts)); // visual slope, rows are ~2x taller
            const c = slope > 2.4 ? "|" : slope < 0.45 ? "-" : y1 > y0 ? "\\" : "/";
            const steps = Math.max(Math.abs(dx), Math.abs(dy));
            for (let s = 1; s < steps; s++) setCell(g, x0 + (dx * s) / steps, y0 + (dy * s) / steps, c, 2);
            if (!m.done) setCell(g, x1, yEnd, "*", 4);
          }

          for (const e of events) {
            const x = xOf(e.t), y = laneY[e.p];
            setCell(g, x, y, e.kind === "s" ? "+" : e.kind === "r" ? "o" : "·", 3);
            if (e.label) {
              const s = String(e.clk);
              for (let i = 0; i < s.length; i++) setCell(g, x + i, y - 1, s[i], 1);
            }
          }

          laneY.forEach((y, k) => {
            setCell(g, xNow, y, "┤", 3);
            const s = ` ${SITES[k]} ${lam[k]}`;
            for (let i = 0; i < s.length; i++) setCell(g, xNow + 1 + i, y, s[i], i < 4 ? 3 : 1);
          });

          const palette = [null, A(0.22), A(0.4), A(0.85), A(1)];
          for (let y = 0; y < g.rows; y++) {
            for (let x = 0; x < g.cols; x++) {
              const c = buf[y * g.cols + x];
              if (c) g.put(x, y, c, palette[col[y * g.cols + x]]);
            }
          }
      }
    </script>
  </body>
</html>
